[package]
name = "dsss-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", features = ["json", "blocking"] }
tokio = { version = "1.0", features = ["full"] }
clap = { version =  "4.0", features = ["derive"] }
url = "2.5"
serde = { version = "1.0", features = ["derive"]}
serde_json = "1.0"
